name: Ticket Summarization and Tagging

on:
  repository_dispatch:
    types: [tines_ticket]

jobs:
  process-tickets:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v2

      # Set up Python environment
      - name: Set up Python 3.8
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      # Cache pip dependencies
      - name: Cache pip dependencies
        uses: actions/cache@v3  # Updated to v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-

      # Install dependencies (only if the cache is missing or requirements.txt has changed)
      - name: Install dependencies
        if: steps.cache-pip.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Cache Hugging Face model files
      - name: Cache Hugging Face models
        uses: actions/cache@v3  # Updated to v3
        with:
          path: ~/.cache/huggingface/transformers
          key: ${{ runner.os }}-hf-model-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-model-

      # Run the Python script with inputs from Tines
      - name: Process Faveo ticket
        run: |
          python process_ticket.py "${{ github.event.client_payload.id }}" "${{ github.event.client_payload.title }}" "${{ github.event.client_payload.body }}"
