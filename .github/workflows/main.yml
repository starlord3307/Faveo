name: Ticket Summarization and Tagging

on:
  repository_dispatch:
    types: [tines_ticket]  # This event type matches the 'event_type' you set in Tines

jobs:
  process-tickets:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v2

      # Set up Python environment
      - name: Set up Python 3.8
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      # Cache pip dependencies
      - name: Cache pip dependencies
        uses: actions/cache@v2
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-${{ hashFiles('**/requirements.txt') }}  # Cache key based on the hash of requirements.txt
          restore-keys: |
            ${{ runner.os }}-python-

      # Install dependencies (only if the cache is missing or requirements.txt has changed)
      - name: Install dependencies
        if: steps.cache-pip.outputs.cache-hit != 'true'  # Skip installation if cache hit is true
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Cache Hugging Face model files
      - name: Cache Hugging Face model
        uses: actions/cache@v2
        with:
          path: ~/.cache/huggingface/transformers
          key: ${{ runner.os }}-hf-model-${{ hashFiles('**/requirements.txt') }}  # Cache Hugging Face model files similarly
          restore-keys: |
            ${{ runner.os }}-hf-model-

      # Run the Python script with inputs from Tines
      - name: Process Faveo ticket
        run: |
          python process_ticket.py "${{ github.event.client_payload.id }}" "${{ github.event.client_payload.title }}" "${{ github.event.client_payload.body }}"
