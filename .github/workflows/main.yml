name: Ticket Summarization and Tagging

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Ticket Title'
        required: true
      body:
        description: 'Ticket Body'
        required: true
      id:
        description: 'Ticket ID'
        required: true

jobs:
  process-tickets:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v2

      # Set up Python environment
      - name: Set up Python 3.8
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      # Cache pip dependencies
      - name: Cache pip dependencies
        uses: actions/cache@v2
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-

      # Cache Hugging Face model files
      - name: Cache Hugging Face model
        uses: actions/cache@v2
        with:
          path: ~/.cache/huggingface/transformers
          key: ${{ runner.os }}-hf-model-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-model-

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run the Python script with inputs from Tines
      - name: Process Faveo ticket
        run: |
          python process_ticket.py "${{ github.event.inputs.id }}" "${{ github.event.inputs.title }}" "${{ github.event.inputs.body }}"
